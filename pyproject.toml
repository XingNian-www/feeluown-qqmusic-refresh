[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuo-qqmusic-refresh"
version = "0.1.2"
description = "Automatic QQ Music login cookie refresh plugin for FeelUOwn"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=41",
  "feeluown>=4.1.13",
  "fuo-qqmusic>=1.0.16",
  "requests>=2.31",
]

[project.entry-points."fuo.plugins_v1"]
qqmusic_refresh = "fuo_qqmusic_refresh"

[tool.setuptools.packages.find]
include = ["fuo_qqmusic_refresh*"]
